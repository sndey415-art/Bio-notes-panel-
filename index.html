<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biology Notes - 12th PCB</title>
  <style>
    /* General Styles */
    body, html { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100%; }
    
    /* Login Screen (Biology Notes Disguise) */
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f4f7f6; color: #333; }
    .study-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
    .study-box h1 { color: #2c3e50; font-size: 24px; margin-bottom: 10px; }
    .study-box p { color: #7f8c8d; margin-bottom: 20px; }
    input[type="password"] { padding: 10px; width: 80%; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 15px; font-size: 16px; text-align: center; }
    button.login-btn { padding: 10px 20px; background-color: #27ae60; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button.login-btn:hover { background-color: #2ecc71; }
    #error-msg { color: #c0392b; margin-top: 10px; display: none; font-weight: bold; }

    /* Chat Screen (ChatGPT Dark Theme) */
    #chat-screen { display: none; flex-direction: column; height: 100vh; background-color: #343541; color: #ececf1; }
    .chat-header { background-color: #202123; padding: 15px; text-align: center; border-bottom: 1px solid #4d4d4f; }
    .chat-header h2 { margin: 0; font-size: 16px; font-weight: 500; }
    .chat-header span { font-size: 12px; color: #10a37f; } 
    
    #messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .message { padding: 10px 15px; border-radius: 8px; max-width: 75%; word-wrap: break-word; line-height: 1.5; font-size: 15px; }
    
    /* Sent (Right) vs Received (Left) */
    .message.sent { background-color: #10a37f; align-self: flex-end; color: white; border-bottom-right-radius: 2px; }
    .message.received { background-color: #444654; align-self: flex-start; color: #ececf1; border-bottom-left-radius: 2px; }
    
    .timestamp { font-size: 10px; margin-top: 5px; opacity: 0.7; text-align: right; }
    .media-content { max-width: 100%; border-radius: 5px; margin-top: 5px; max-height: 250px; }
    
    .input-area { background-color: #343541; padding: 15px; display: flex; gap: 10px; justify-content: center; border-top: 1px solid #4d4d4f; }
    .input-box { display: flex; width: 100%; max-width: 800px; background-color: #40414f; border-radius: 8px; padding: 5px 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); align-items: center; }
    .input-box input { flex: 1; background: transparent; border: none; color: white; padding: 10px; font-size: 16px; outline: none; }
    .input-box button { background: transparent; border: none; color: #ececf1; cursor: pointer; padding: 10px; font-size: 18px; }
    .input-box button:hover { color: #10a37f; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN (DISGUISE) -->
  <div id="login-screen">
    <div class="study-box">
      <h1>Biology Notes (12th PCB)</h1>
      <p>Enter access key to view notes.</p>
      <input type="password" id="password-input" placeholder="Access Key">
      <br>
      <button class="login-btn" onclick="checkPassword()">Access Notes</button>
      <div id="error-msg">Incorrect Access Key.</div>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chat-screen">
    <div class="chat-header">
      <h2>Secure Chat</h2>
      <span>Status: Online</span>
    </div>
    
    <div id="messages-container"></div>

    <div class="input-area">
      <div class="input-box">
        <!-- Media URL Button -->
        <button onclick="sendMedia()" title="Send Image/Video URL">📎</button>
        <!-- Text Input (Native Emojis supported here) -->
        <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleEnter(event)">
        <!-- Send Button -->
        <button onclick="sendMessage()">▶</button>
      </div>
    </div>
  </div>

  <script type="module">
    // 1. Firebase Modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 2. Your Exact Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAE_N7EbtwFNaT3oLK3TAt-cqxrAkzuFSo",
      authDomain: "bionotes-96fe1.firebaseapp.com",
      projectId: "bionotes-96fe1",
      storageBucket: "bionotes-96fe1.firebasestorage.app",
      messagingSenderId: "949138478789",
      appId: "1:949138478789:web:72eda8afcbfba5e53582ac",
      measurementId: "G-06LQWSJYR8"
    };

    // 3. Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 4. Setup Author Identity (To show messages on Left/Right properly)
    let myAuthorId = localStorage.getItem('chatAuthorId');
    if (!myAuthorId) {
      myAuthorId = 'user_' + Math.floor(Math.random() * 1000000000);
      localStorage.setItem('chatAuthorId', myAuthorId);
    }

    // 5. Password Verification
    const CHAT_PASSWORD = "DAIRY MILK";

    window.checkPassword = function() {
      const input = document.getElementById('password-input').value;
      if (input === CHAT_PASSWORD) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        loadMessages();
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    }

    window.handleEnter = function(e) {
      if (e.key === 'Enter') sendMessage();
    }

    // 6. Send Text/Emoji Message
    window.sendMessage = async function() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (text === "") return;
      
      input.value = ''; // Clear inputbox

      try {
        await addDoc(collection(db, "messages"), {
          text: text,
          type: "text",
          author: myAuthorId,
          timestamp: serverTimestamp()
        });
      } catch (e) {
        alert("Message fail! Ensure Firestore Database is enabled in Test Mode.");
      }
    }

    // 7. Send Photo/Video via URL
    window.sendMedia = async function() {
      const url = prompt("Paste the Image or Video Link (URL) here:");
      if (!url) return;

      let type = "image";
      if (url.match(/\.(mp4|webm|ogg)$/i) || url.includes("video")) {
        type = "video";
      }

      try {
        await addDoc(collection(db, "messages"), {
          text: url,
          type: type,
          author: myAuthorId,
          timestamp: serverTimestamp()
        });
      } catch (e) {
        alert("Media send fail! Ensure Firestore Database is enabled in Test Mode.");
      }
    }

    // 8. Load Messages in Real-Time
    function loadMessages() {
      const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
      
      onSnapshot(q, (snapshot) => {
        const container = document.getElementById('messages-container');
        container.innerHTML = ''; 

        snapshot.forEach((doc) => {
          const msg = doc.data();
          const div = document.createElement('div');
          
          // Check if message is mine (sent) or GF's (received)
          if (msg.author === myAuthorId) {
            div.className = 'message sent';
          } else {
            div.className = 'message received';
          }

          // Format Time
          let timeString = '';
          if (msg.timestamp) {
            const date = msg.timestamp.toDate();
            timeString = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          }

          // Render Text, Image or Video
          if (msg.type === "image") {
            div.innerHTML = `<img src="${msg.text}" class="media-content" alt="Image"><div class="timestamp">${timeString}</div>`;
          } else if (msg.type === "video") {
            div.innerHTML = `<video src="${msg.text}" controls class="media-content"></video><div class="timestamp">${timeString}</div>`;
          } else {
            div.innerHTML = `<div>${msg.text}</div><div class="timestamp">${timeString}</div>`;
          }

          container.appendChild(div);
        });

        // Auto-scroll to latest message
        container.scrollTop = container.scrollHeight;
      });
    }
  </script>
</body>
</html>
